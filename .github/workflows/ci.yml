name: CI

on:
  push:
    branches: [main]
  pull_request:

# The token only needs to read the repo: no step publishes, comments or tags.
permissions:
  contents: read

# A newer push supersedes a run still in flight on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Caching is left at its `auto` default, which enables it for push and
      # pull_request but not for events where a poisoned cache would be a
      # security problem.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # --locked fails if uv.lock no longer matches pyproject.toml, instead of
      # quietly resolving something the developer never tested. The Python
      # version comes from .python-version.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest
