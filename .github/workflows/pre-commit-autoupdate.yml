name: pre-commit autoupdate

# Dependabot has no ecosystem for .pre-commit-config.yaml, so the pinned `rev`
# values there would stay frozen forever. This is their updater.
on:
  schedule:
    # Mondays at 06:00 UTC, ahead of the working week.
    - cron: "0 6 * * 1"
  workflow_dispatch:

# A manual dispatch launched while the weekly run is in flight would have both
# pushing to the same branch.
concurrency:
  group: pre-commit-autoupdate
  cancel-in-progress: false

# Nothing here needs write access, so the workflow grants none by default and
# the job that opens the pull request asks for what it needs.
permissions: {}

jobs:
  autoupdate:
    runs-on: ubuntu-latest
    # The default is 360 minutes; this job takes about two.
    timeout-minutes: 10
    # `contents: write` pushes the update branch, `pull-requests: write` opens
    # the pull request. Both belong to create-pull-request, not to the workflow.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # create-pull-request authenticates the push with its own `token`
          # input, so the checkout credentials are dead weight. Leaving them
          # also risks the duplicate Authorization header the action reports
          # against checkout v6+.
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install dependencies
        run: uv sync --locked

      - name: Update hook revisions
        run: uv run pre-commit autoupdate

      # Runs the updated hooks so anything they rewrite travels in the same pull
      # request. `|| true` is what makes that possible: pre-commit exits non-zero
      # both when a hook rewrites a file and when a hook is genuinely broken, and
      # the two are indistinguishable here. So the pull request always opens, and
      # its own CI run is what decides whether the update is good.
      - name: Run updated hooks
        run: uv run pre-commit run --all-files || true

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: ci/pre-commit-autoupdate-run
          title: "ci: update pre-commit hook revisions"
          commit-message: "ci: update pre-commit hook revisions"
          body: |
            Automated `pre-commit autoupdate`.

            Dependabot does not cover `.pre-commit-config.yaml`, so this workflow
            keeps the pinned hook revisions current.

            Check that each revision is newer than the one it replaces. Projects
            that tag patch releases off a side branch are resolved to the newest
            tag reachable from their default branch, which can be older.

            Note: pull requests opened with `GITHUB_TOKEN` do not trigger other
            workflows, so CI will not start on its own. Close and reopen this PR
            to run it before merging.
          delete-branch: true
