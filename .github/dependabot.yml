version: 2
updates:
  # Actions are pinned by SHA, which freezes them until something bumps them.
  # Dependabot is that something: without it, pinning means running unpatched code.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  # uv is a native ecosystem: Dependabot reads pyproject.toml and uv.lock.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns: ["*"]
