version: 2
updates:
  # Actions are pinned by SHA, which freezes them until something bumps them.
  # Dependabot is that something: without it, pinning means running unpatched code.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
    # Merges are squashed, so the pull request title becomes the commit message.
    # Dependabot infers a prefix from repository history; stating it keeps the
    # convention deterministic instead of guessed.
    commit-message:
      prefix: "ci"

  # uv is a native ecosystem: Dependabot reads pyproject.toml and uv.lock.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns: ["*"]
    # Both prefixes are set because every dependency today lives in the dev
    # group, and runtime dependencies will not.
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
